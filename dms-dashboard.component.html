<form [formGroup]="trendsForm">
    <app-cds-container title="Trends" icon="show_chart" [collapsible]="false">
      <!-- Filter Button inside title strip -->
      <div class="relative trends-filter-popover" header-actions>
        <!-- Toggle Filter Button -->
        <button
          (click)="showTrendsFilter = !showTrendsFilter"
          class="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg shadow-md transition duration-150"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 9l-7 7-7-7"
            />
          </svg>
          Filter
        </button>

        <!-- Popover Dropdowns -->
        <div
          *ngIf="showTrendsFilter"
          class="absolute right-0 mt-2 w-44 bg-white border border-gray-200 rounded-lg shadow-lg p-3 z-50"
        >
          <cds-select
            label="Period Type"
            [optionsList]="periodTypeOptions"
            formControlName="periodtype"
            class="mb-3"
            (selectionChange)="onPeriodTypeChange('trends')"
          ></cds-select>

          <!-- Days Dropdown -->
          <cds-select
            *ngIf="trendsForm.get('periodtype')?.value?.value === '1'"
            label="Days"
            formControlName="periodvalue"
            class="mb-3"
            [optionsList]="periodValueDayOptions"
            (selectionChange)="updateTrendsChartData()"
          ></cds-select>
          <!-- Months Dropdown -->
          <cds-select
            *ngIf="trendsForm.get('periodtype')?.value?.value === '2'"
            label="Months"
            formControlName="periodvalue"
            class="mb-3"
            [optionsList]="periodValueMonthOptions"
            (selectionChange)="updateTrendsChartData()"
          ></cds-select>

          <cds-select
            label="View"
            [optionsList]="viewOptions"
            formControlName="view"
            class="text-sm"
          ></cds-select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-4">
        <cds-select label="Region" formControlName="region" placeholder="Select a value" [optionsList]="regionOptions" (selectionChange)="updateTrendsChartData()"></cds-select>
        <cds-select label="State" formControlName="state" placeholder="Select a value" [optionsList]="stateOptions" (selectionChange)="updateTrendsChartData()"></cds-select>
        <cds-select label="Product Group" formControlName="productGroup" placeholder="Select a value" [optionsList]="productGroupOptions" (selectionChange)="updateTrendsChartData()"></cds-select>
        <cds-select label="Distributor" formControlName="distributor" placeholder="Select a value" [optionsList]="distributorOptions" (selectionChange)="updateTrendsChartData()"></cds-select>
        <cds-select label="Graph List" [optionsList]="graphTypeOptions" formControlName="graphType" class="w-full"></cds-select>
      </div>

      <div class="flex justify-end gap-4 mb-4">
        <cds-button [variant]="'primary'">Search</cds-button>
        <cds-button [variant]="'danger'" (click)="onClear()">Clear</cds-button>
      </div>

      <!-- Chart Section: Single consolidated chart -->
      <div *ngIf="trendsForm.get('view')?.value?.value === 'graph'">
        <div *ngIf="trendsForm.get('graphType')?.value?.value === 'bar'" class="flex justify-center mb-6">
          <div class="w-full max-w-4xl">
            <canvas baseChart [data]="trendsBarChartData" [type]="'bar'" [options]="trendsBarChartOptions"></canvas>
          </div>
        </div>
        <div *ngIf="trendsForm.get('graphType')?.value?.value === 'pie'" class="flex justify-center mb-6">
          <div class="w-full max-w-4xl">
            <canvas baseChart [data]="trendsPieChartData" [type]="'pie'" [options]="trendsPieChartOptions"></canvas>
          </div>
        </div>
        <div *ngIf="trendsForm.get('graphType')?.value?.value === 'donut'" class="flex justify-center mb-6">
          <div class="w-full max-w-4xl">
            <canvas baseChart [data]="trendsDonutChartData" [type]="'doughnut'" [options]="trendsDonutChartOptions"></canvas>
          </div>
        </div>
        <div *ngIf="trendsForm.get('graphType')?.value?.value === 'line'" class="flex justify-center mb-6">
          <div class="w-full max-w-4xl">
            <canvas baseChart [data]="trendsLineChartData" [type]="'line'" [options]="trendsLineChartOptions"></canvas>
          </div>
        </div>
      </div>
      <!-- List/Table View -->
      <app-table *ngIf="trendsForm.get('view')?.value?.value === 'list'" [headers]="trendsTableHeaders" [data]="trendsTableData" [itemsPerPage]="6"></app-table>
    </app-cds-container>
  </form>
